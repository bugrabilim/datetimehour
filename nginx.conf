# Saat Tarih statik sunucusu. http→https 301 yönlendirmesi ve sertifika Traefik'te (ortak ayar).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

  # HSTS max-age=86400 ile başlar; bir hafta sorun çıkmazsa 31536000 yapılır (CLAUDE.md).
  add_header Strict-Transport-Security "max-age=86400" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://istatistik.bumba.tr; connect-src 'self' https://istatistik.bumba.tr https://bumbagroup.com https://api.open-meteo.com; img-src 'self' data: https://bumbagroup.com https://tile.openstreetmap.org; style-src 'self'; font-src 'self'; form-action 'self' https://bumbagroup.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;

  location / {
    try_files $uri $uri/ =404;
    expires 5m;
  }

  # Dosya adları ?v=<özet> ile sürümlendiği için uzun süre önbelleğe alınır.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Gömülü widget sayfaları başka sitelerde iframe içinde gösterilebilir (diğer başlıklar aynı kalır).
  # nginx'te add_header yalnız konumda tanımlı değilse miras alınır; bu yüzden hepsi yeniden yazılır.
  location ^~ /embed/ {
    try_files $uri $uri/ =404;
    expires 5m;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://istatistik.bumba.tr; connect-src 'self' https://istatistik.bumba.tr https://bumbagroup.com https://api.open-meteo.com; img-src 'self' data: https://bumbagroup.com https://tile.openstreetmap.org; style-src 'self'; font-src 'self'; form-action 'self' https://bumbagroup.com; base-uri 'self'; object-src 'none'; frame-ancestors *; upgrade-insecure-requests" always;
  }

  location = /404.html { internal; }
  location = /500.html { internal; }
}
