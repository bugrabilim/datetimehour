# Saat Tarih statik sunucusu. http→https 301 yönlendirmesi ve sertifika Traefik'te (ortak ayar).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;
  absolute_redirect off;
  port_in_redirect off;

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_types text/calendar text/css application/javascript application/json image/svg+xml application/xml text/plain application/manifest+json;

  # HSTS 8 Ekim 2026 max-age=86400 ile başladı, 15 Ekim 2026 bir yıla (31536000) çıkarıldı (CLAUDE.md).
  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://istatistik.bumba.tr; connect-src 'self' https://istatistik.bumba.tr https://bumbagroup.com https://api.open-meteo.com https://overpass-api.de; img-src 'self' data: https://bumbagroup.com; style-src 'self'; font-src 'self'; form-action 'self' https://bumbagroup.com; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;

  error_page 404 /404.html;
  error_page 500 502 503 504 /500.html;

  # Kaldırılan sayfalar (9 Ekim 2026: Bugün sayfası kaldırıldı, tarih üst barda) ana sayfaya yönlenir.
  location = /bugun-ayin-kaci/ { return 301 /; }
  location = /en/todays-date/ { return 301 /en/; }
  location = /de/todays-date/ { return 301 /de/; }
  location = /az/todays-date/ { return 301 /az/; }
  location = /ar/todays-date/ { return 301 /ar/; }

  # Rozetler sayfası kaldırıldı (30 Ekim 2026: kazanım rozetleri yalnız mobil uygulamalarda).
  location = /rozetler/ { return 301 /; }
  location = /en/badges/ { return 301 /en/; }
  location = /de/badges/ { return 301 /de/; }
  location = /az/badges/ { return 301 /az/; }
  location = /ar/badges/ { return 301 /ar/; }

  # Doğa sayfası "Mevsimler" oldu (9 Ekim 2026).
  location = /doga/ { return 301 /mevsimler/; }
  location = /en/nature/ { return 301 /en/seasons/; }
  location = /de/nature/ { return 301 /de/seasons/; }
  location = /az/nature/ { return 301 /az/seasons/; }
  location = /ar/nature/ { return 301 /ar/seasons/; }

  location / {
    try_files $uri $uri/ =404;
    expires 5m;
  }

  # Dosya adları ?v=<özet> ile sürümlendiği için uzun süre önbelleğe alınır.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Takvim aboneliği (.ics, 30 Ekim 2026): text/calendar; add_header miras alınmadığı için başlıklar yeniden yazılır.
  location ^~ /ics/ {
    types { }
    default_type "text/calendar; charset=utf-8";
    try_files $uri =404;
    expires 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Açık veri (statik JSON API, 30 Ekim 2026): herkese açık, CORS *, bir gün önbellek. add_header miras alınmadığı için
  # başlıklar yeniden yazılır.
  location ^~ /api/ {
    types { }
    default_type "application/json; charset=utf-8";
    try_files $uri =404;
    expires 1d;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # Gömülü widget sayfaları başka sitelerde iframe içinde gösterilebilir (diğer başlıklar aynı kalır).
  # nginx'te add_header yalnız konumda tanımlı değilse miras alınır; bu yüzden hepsi yeniden yazılır.
  location ^~ /embed/ {
    try_files $uri $uri/ =404;
    expires 5m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://istatistik.bumba.tr; connect-src 'self' https://istatistik.bumba.tr https://bumbagroup.com https://api.open-meteo.com https://overpass-api.de; img-src 'self' data: https://bumbagroup.com; style-src 'self'; font-src 'self'; form-action 'self' https://bumbagroup.com; base-uri 'self'; object-src 'none'; frame-ancestors *; upgrade-insecure-requests" always;
  }

  location = /404.html { internal; }
  location = /500.html { internal; }
}
