name: iOS TestFlight
# Yalnız elle ("Run workflow") uygulamayı imzalayıp TestFlight'a yükler. 31 Ekim 2026'dan beri main'e iOS değişikliği girmesi
# yapı başlatmaz (sahibin kararı: bütün Apple yayınları tek seferde, sahibin onayıyla; site ayrıca canlıya alınabilsin diye).
# Gerekli gizli değişkenler (App Store Connect API anahtarı): ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8.
# Anahtar yoksa iş hata vermeden atlanır. İmzalama Xcode'un bulut imzalamasıyla yapılır (sertifika depoda yok).
# Arşiv imzasız alınır: geliştirme imzası kayıtlı cihaz ister, hesapta cihaz yok. Dağıtım imzası yüklemede atılır.
on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight'a yükle
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Anahtar denetimi
        id: keys
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::App Store Connect anahtarları tanımlı değil; TestFlight yüklemesi atlandı."
          fi
      - uses: actions/checkout@v4
        if: steps.keys.outputs.ok == '1'
      - name: Xcode projesi
        if: steps.keys.outputs.ok == '1'
        run: |
          brew install xcodegen
          xcodegen generate --spec mobile/ios/project.yml
          xcodebuild -version
      - name: API anahtarı
        if: steps.keys.outputs.ok == '1'
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
      - name: Arşivle
        if: steps.keys.outputs.ok == '1'
        run: |
          xcodebuild -project mobile/ios/SaatTarih.xcodeproj -scheme SaatTarih -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/SaatTarih.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} -quiet archive
      - name: Yetkiler (geçici imza)
        if: steps.keys.outputs.ok == '1'
        # İmzasız arşivde yetkiler (WeatherKit) yoktur; dağıtım imzası yetkileri mevcut imzadan alır.
        # Bu yüzden önce içtekiler (Apple Watch komplikasyonu ve uygulaması, widget), sonra uygulama yetki dosyasıyla
        # geçici (ad hoc) imzalanır.
        run: |
          APP="$RUNNER_TEMP/SaatTarih.xcarchive/Products/Applications/SaatTarih.app"
          for X in "$APP"/Watch/*.app/PlugIns/*.appex; do [ -e "$X" ] && codesign --force --sign - "$X"; done
          for X in "$APP"/Watch/*.app; do [ -e "$X" ] && codesign --force --sign - "$X"; done
          for X in "$APP"/PlugIns/*.appex; do codesign --force --sign - "$X"; done
          codesign --force --sign - --entitlements mobile/ios/App/SaatTarih.entitlements "$APP"
          codesign -d --entitlements - "$APP"
      - name: Denetle (yerel dışa aktarım)
        if: steps.keys.outputs.ok == '1'
        run: |
          cp mobile/ios/ExportOptions.plist "$RUNNER_TEMP/export-local.plist"
          plutil -replace destination -string export "$RUNNER_TEMP/export-local.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SaatTarih.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export-local.plist" -exportPath "$RUNNER_TEMP/local" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cd "$RUNNER_TEMP/local" && unzip -q -o *.ipa
          echo "Dağıtım imzasındaki yetkiler:"
          codesign -d --entitlements - Payload/SaatTarih.app
          codesign -d --entitlements - Payload/SaatTarih.app 2>&1 | grep -q weatherkit || { echo "::error::WeatherKit yetkisi dağıtım imzasında yok"; exit 1; }
          codesign -d --entitlements - Payload/SaatTarih.app 2>&1 | grep -q ubiquity-kvstore-identifier || { echo "::error::iCloud anahtar-değer yetkisi dağıtım imzasında yok (Apple Developer › Identifiers › tr.bumba.time › iCloud açılmalı)"; exit 1; }
          codesign -d --entitlements - Payload/SaatTarih.app 2>&1 | grep -q com.apple.developer.healthkit || { echo "::error::HealthKit yetkisi dağıtım imzasında yok (Apple Developer › Identifiers › tr.bumba.time › HealthKit açılmalı)"; exit 1; }
      - name: Yükle
        if: steps.keys.outputs.ok == '1'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/SaatTarih.xcarchive" \
            -exportOptionsPlist mobile/ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Yüklenen yapı numarası: ${{ github.run_number }}"
      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
