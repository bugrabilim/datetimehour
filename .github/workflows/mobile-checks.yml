name: Mobil denetimler
# Mobil uygulamaların ortak hesap çekirdeği ve üretilen veriler: Linux'ta test ve denetim (standart 5.35: Linux'taki test
# ve lint işleri mobil derleme onayına girmez, kendiliğinden çalışır). iOS, Android ve Mac/TV/Vision derlemeleri
# mobile.yml'de, yalnız elle (patronun her çalıştırma için onayıyla).
on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/js/prayer-calc.js"
      - "src/js/nature-calc.js"
      - "src/data/**"
      - "lib/**"
      - "src/i18n/**"
      - "src/i18n-cal/**"
      # Hesap ekranı metinleri ve ülke listesi (üyelik sunucusuyla ortak; gen-strings uygulamalara kopyalar)
      - "server/i18n/account.json"
      - "server/data/countries.json"
      - ".github/workflows/mobile-checks.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/js/prayer-calc.js"
      - "src/js/nature-calc.js"
      - "src/data/**"
      - "lib/**"
      - "src/i18n/**"
      - "src/i18n-cal/**"
      # Hesap ekranı metinleri ve ülke listesi (üyelik sunucusuyla ortak; gen-strings uygulamalara kopyalar)
      - "server/i18n/account.json"
      - "server/data/countries.json"
      - ".github/workflows/mobile-checks.yml"

# Aynı PR'a (ya da dala) yeni commit gelince eski çalışma iptal edilir: üst üste gönderimlerde eski commit'lerin
# sonuçları gereksiz "Run failed" bildirimi göndermesin (3 Kasım 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-data:
    name: Ortak test verisi güncel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mobile/shared/gen-vectors.mjs --check
      - run: node mobile/shared/gen-strings.mjs --check
      - run: node mobile/shared/gen-religion.mjs --check
      - run: python3 -I mobile/shared/icons3d/gen-icons3d.py --check
      # İki tonlu simgeler (Phosphor, sabit sürüm): npm pack ile paketi indirip yeniden üretir, depodakiyle karşılaştırır
      - run: node mobile/shared/icons/gen-duotone.mjs --check
      - run: node mobile/ios/scripts/check-swift.mjs

  swift-linux:
    name: Swift çekirdek (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path mobile/ios/SaatCore

  kotlin:
    name: Kotlin çekirdek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testler
        working-directory: mobile/android
        run: ./gradlew :core:test

