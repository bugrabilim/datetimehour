name: Mobil
# Mobil uygulamaların ortak hesap çekirdeği: Swift (iOS, iPadOS, watchOS) ve Kotlin (Android, Wear OS).
# İki dildeki hesaplar, sitedeki JS hesaplarından üretilen ortak test verisiyle birebir karşılaştırılır.
on:
  pull_request:
    paths:
      - "mobile/**"
      - "src/js/prayer-calc.js"
      - "src/js/nature-calc.js"
      - "src/data/provinces.json"
      - "src/data/cities.json"
      - "src/data/places.json"
      - "src/i18n/**"
      - ".github/workflows/mobile.yml"
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "src/js/prayer-calc.js"
      - "src/js/nature-calc.js"
      - "src/data/provinces.json"
      - "src/data/cities.json"
      - "src/data/places.json"
      - "src/i18n/**"
      - ".github/workflows/mobile.yml"

jobs:
  test-data:
    name: Ortak test verisi güncel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mobile/shared/gen-vectors.mjs --check
      - run: node mobile/shared/gen-strings.mjs --check

  swift-linux:
    name: Swift çekirdek (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path mobile/ios/SaatCore

  swift-apple:
    name: Swift çekirdek (macOS, Xcode)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path mobile/ios/SaatCore

  kotlin:
    name: Kotlin çekirdek
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Testler
        working-directory: mobile/android
        run: ./gradlew :core:test

  android-app:
    name: Android uygulaması
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Ekran görüntüleri emülatörsüz (Robolectric + Roborazzi, ScreenshotTest)
      - name: Derle ve ekran görüntüleri
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ekran-goruntuleri
          path: mobile/android/app/build/screens

  ios-app:
    name: iOS uygulaması (simülatör)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Xcode projesi
        run: xcodegen generate --spec mobile/ios/project.yml
      - name: Derle
        run: |
          xcodebuild -version
          xcodebuild -project mobile/ios/SaatTarih.xcodeproj -scheme SaatTarih -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Ekran görüntüleri
        run: mobile/ios/scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/SaatTarih.app shots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ekran-goruntuleri
          path: shots
