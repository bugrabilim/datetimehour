name: Mobil
# Mobil derlemeler (standart 5.35, mobil derleme onayı; 25 Kasım 2026 patronun kararı "kalksın"): yalnız elle başlar,
# PR'da, push'ta ya da zamanlanmış olarak kendiliğinden çalışmaz. Her çalıştırma için iş, neden, makine türü ve tahmini
# dakika patrona ayrı bir soruyla sorulur. Linux'taki test ve denetimler mobile-checks.yml'de, kendiliğinden.
on:
  workflow_dispatch:
    inputs:
      is:
        description: "Çalışacak iş"
        type: choice
        options: [hepsi, swift-apple, android-app, ios-app, apple-desk]
        default: hepsi

# Aynı PR'a (ya da dala) yeni commit gelince eski çalışma iptal edilir: üst üste gönderimlerde eski commit'lerin
# sonuçları gereksiz "Run failed" bildirimi göndermesin (3 Kasım 2026).
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  swift-apple:
    name: Swift çekirdek (macOS, Xcode)
    if: inputs.is == 'hepsi' || inputs.is == 'swift-apple'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version && swift --version
      - run: swift test --package-path mobile/ios/SaatCore

  android-app:
    name: Android uygulaması
    if: inputs.is == 'hepsi' || inputs.is == 'android-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      # Ekran görüntüleri emülatörsüz (Robolectric + Roborazzi, ScreenshotTest)
      - name: Derle ve ekran görüntüleri
        working-directory: mobile/android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :wear:assembleDebug :wear:testDebugUnitTest :watchface:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
            mobile/android/wear/build/outputs/apk/debug/wear-debug.apk
            mobile/android/watchface/build/outputs/apk/debug/watchface-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ekran-goruntuleri
          path: |
            mobile/android/app/build/screens
            mobile/android/wear/build/screens

  ios-app:
    name: iOS uygulaması (simülatör)
    if: inputs.is == 'hepsi' || inputs.is == 'ios-app'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Xcode projesi
        run: xcodegen generate --spec mobile/ios/project.yml
      - name: Derle
        run: |
          xcodebuild -version
          xcodebuild -project mobile/ios/SaatTarih.xcodeproj -scheme SaatTarih -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Ekran görüntüleri
        run: mobile/ios/scripts/screenshots.sh build/Build/Products/Debug-iphonesimulator/SaatTarih.app shots
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ekran-goruntuleri
          path: shots

  # Mac menü çubuğu, Apple TV ve Vision Pro uygulamaları (rakip analizi listesi #95–#97): derlenir, imzasız.
  # Koşucuda tvOS ya da visionOS platformu kurulu değilse önce indirilir.
  apple-desk:
    name: Mac, Apple TV ve Vision Pro uygulamaları
    if: inputs.is == 'hepsi' || inputs.is == 'apple-desk'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Xcode projesi
        run: xcodegen generate --spec mobile/ios/project.yml
      - name: Platformlar
        run: |
          xcodebuild -version
          xcodebuild -showsdks | tee sdks.txt
          grep -q appletvsimulator sdks.txt || xcodebuild -downloadPlatform tvOS
          grep -q xrsimulator sdks.txt || xcodebuild -downloadPlatform visionOS
      - name: Mac
        run: |
          xcodebuild -project mobile/ios/SaatTarih.xcodeproj -scheme SaatTarihMac -configuration Debug \
            -destination 'generic/platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Apple TV
        run: |
          xcodebuild -project mobile/ios/SaatTarih.xcodeproj -scheme SaatTarihTV -configuration Debug \
            -destination 'generic/platform=tvOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Vision Pro
        run: |
          xcodebuild -project mobile/ios/SaatTarih.xcodeproj -scheme SaatTarihVision -configuration Debug \
            -destination 'generic/platform=visionOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
