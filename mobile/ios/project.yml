# Xcode projesi bu dosyadan üretilir (XcodeGen): xcodegen generate --spec mobile/ios/project.yml
# .xcodeproj depoya girmez; CI her derlemede yeniden üretir.
name: SaatTarih
options:
  bundleIdPrefix: tr.bumba
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    # Uygulama ve widget aynı sürümde olmalı (App Store şartı)
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SaatCore:
    path: SaatCore
targets:
  SaatTarih:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SaatCore
      - target: SaatTarihWidget
      # Apple Watch uygulaması (komplikasyonlarıyla) iPhone uygulamasının Watch klasörüne gömülür
      - target: SaatTarihWatch
        embed: true
        codeSign: false
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    settings:
      base:
        PRODUCT_NAME: SaatTarih
        PRODUCT_BUNDLE_IDENTIFIER: tr.bumba.time
        DEVELOPMENT_TEAM: 3J9XN2P93D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        # iPhone ve iPad (rakip analizi #18; iPad'de bölünmüş ekran için dört yön de açık). Apple silikonlu Mac'lerde
        # "iPad için tasarlandı" olarak çalışır (App Store Connect'te kapatılabilir)
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # INFOPLIST_KEY_* ile verilemeyen anahtarlar (AlarmKit izni) bu dosyada; Xcode ikisini birleştirir
        INFOPLIST_FILE: App/Info.plist
        # Hava durumu: Apple WeatherKit (App ID'de WeatherKit hem Capabilities hem App Services sekmesinde açık olmalı)
        CODE_SIGN_ENTITLEMENTS: App/SaatTarih.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Saat Tarih
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Metnin diğer dilleri App/Resources/InfoPlist.xcstrings'te (gen-strings.mjs üretir)
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Alarm sesi olarak müzik arşivinizden bir şarkı seçebilmeniz için. Şarkıdan alınan kısa bölüm telefonda kalır, hiçbir yere gönderilmez."
        INFOPLIST_KEY_NSCameraUsageDescription: "Alarm kapatma görevi için kaydettiğiniz QR kodu ya da barkodu okumak için. Görüntü telefonda işlenir, kaydedilmez ve hiçbir yere gönderilmez."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Biten aralık antrenmanlarını ve rutinleri, siz açarsanız, Sağlık uygulamasına antrenman olarak yazmak için. Uygulama Sağlık verilerinizi okumaz."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Bulunduğunuz yerin namaz vakitlerini, kıble yönünü, yakındaki camileri ve hava durumunu göstermek için. Vakitler ve kıble telefonda hesaplanır; hava durumu ve cami araması için yalnız yaklaşık konum Apple'ın servislerine gönderilir. Konuma bağlı hatırlatıcılarda bir yere varışınızı ya da ayrılışınızı iPhone kendisi izler."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    scheme:
      testTargets: []
  # Ana ekran ve kilit ekranı widget'ları (WidgetKit). Uygulamayla ortak dosyalar App/Sources'tan alınır.
  SaatTarihWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: App/Sources/Province.swift
      - path: App/Sources/Theme.swift
      - path: App/Sources/Schedule.swift
      - path: App/Sources/AnalogClock.swift
      - path: App/Sources/Location.swift
      - path: App/Sources/Hijri.swift
      - path: App/Sources/LiveActivityModel.swift
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/provinces.json
      - path: App/Resources/cities.json
      - path: App/Resources/hijri.json
    dependencies:
      - package: SaatCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Saat Tarih
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
    settings:
      base:
        PRODUCT_NAME: SaatTarihWidget
        PRODUCT_BUNDLE_IDENTIFIER: tr.bumba.time.widget
        DEVELOPMENT_TEAM: 3J9XN2P93D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  # Apple Watch uygulaması (rakip analizi #6): saat, tarih (miladi + hicri), sıradaki vakit, bugünün vakitleri, yer
  # seçimi (iPhone'daki yer WatchConnectivity ile gelir). Hesap SaatCore'da; ortak dosyalar App/Sources'tan.
  SaatTarihWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Watch/Sources
      - path: Watch/Assets.xcassets
      - path: App/Sources/Province.swift
      - path: App/Sources/Schedule.swift
      - path: App/Sources/Location.swift
      - path: App/Sources/Hijri.swift
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/InfoPlist.xcstrings
      - path: App/Resources/provinces.json
      - path: App/Resources/hijri.json
    dependencies:
      - package: SaatCore
      - target: SaatTarihWatchWidget
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Saat Tarih
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: tr.bumba.time
        NSLocationWhenInUseUsageDescription: "Bulunduğunuz yerin namaz vakitlerini göstermek için. Vakitler saatte hesaplanır, konum hiçbir yere gönderilmez."
    settings:
      base:
        PRODUCT_NAME: SaatTarihWatch
        PRODUCT_BUNDLE_IDENTIFIER: tr.bumba.time.watchkitapp
        DEVELOPMENT_TEAM: 3J9XN2P93D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
  # Apple Watch komplikasyonları (WidgetKit): sıradaki vakit ve hicri tarih
  SaatTarihWatchWidget:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: WatchWidget/Sources
      - path: Widget/Sources/ProvinceIntent.swift
      - path: App/Sources/Province.swift
      - path: App/Sources/Schedule.swift
      - path: App/Sources/Location.swift
      - path: App/Sources/Hijri.swift
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/provinces.json
      - path: App/Resources/hijri.json
    dependencies:
      - package: SaatCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: WatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Saat Tarih
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
    settings:
      base:
        PRODUCT_NAME: SaatTarihWatchWidget
        PRODUCT_BUNDLE_IDENTIFIER: tr.bumba.time.watchkitapp.widget
        DEVELOPMENT_TEAM: 3J9XN2P93D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
