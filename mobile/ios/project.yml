# Xcode projesi bu dosyadan üretilir (XcodeGen): xcodegen generate --spec mobile/ios/project.yml
# .xcodeproj depoya girmez; CI her derlemede yeniden üretir.
name: SaatTarih
options:
  bundleIdPrefix: tr.bumba
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    # Uygulama ve widget aynı sürümde olmalı (App Store şartı)
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  SaatCore:
    path: SaatCore
targets:
  SaatTarih:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
    dependencies:
      - package: SaatCore
      - target: SaatTarihWidget
    settings:
      base:
        PRODUCT_NAME: SaatTarih
        PRODUCT_BUNDLE_IDENTIFIER: tr.bumba.time
        DEVELOPMENT_TEAM: 3J9XN2P93D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        # INFOPLIST_KEY_* ile verilemeyen anahtarlar (AlarmKit izni) bu dosyada; Xcode ikisini birleştirir
        INFOPLIST_FILE: App/Info.plist
        # Hava durumu: Apple WeatherKit (App ID'de WeatherKit hem Capabilities hem App Services sekmesinde açık olmalı)
        CODE_SIGN_ENTITLEMENTS: App/SaatTarih.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Saat Tarih
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Metnin diğer dilleri App/Resources/InfoPlist.xcstrings'te (gen-strings.mjs üretir)
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Bulunduğunuz yerin namaz vakitlerini göstermek için. Konumunuz yalnız telefonda kullanılır, hiçbir yere gönderilmez."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    scheme:
      testTargets: []
  # Ana ekran ve kilit ekranı widget'ları (WidgetKit). Uygulamayla ortak dosyalar App/Sources'tan alınır.
  SaatTarihWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: App/Sources/Province.swift
      - path: App/Sources/Theme.swift
      - path: App/Sources/Schedule.swift
      - path: App/Sources/AnalogClock.swift
      - path: App/Sources/Location.swift
      - path: App/Resources/Localizable.xcstrings
      - path: App/Resources/provinces.json
    dependencies:
      - package: SaatCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Saat Tarih
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSWidgetWantsLocation: true
    settings:
      base:
        PRODUCT_NAME: SaatTarihWidget
        PRODUCT_BUNDLE_IDENTIFIER: tr.bumba.time.widget
        DEVELOPMENT_TEAM: 3J9XN2P93D
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
